<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Careers at Envitia</title>
  <link rel="stylesheet" href="https://use.typekit.net/zgy8jnl.css" />
  <style>
    :root {
      --green:      #84bd00;
      --green-dark: #6aa000;
      --dark:       #1f2a44;
      --dark-mid:   #2d3d5e;
      --light:      #f5f7fa;
      --white:      #ffffff;
      --border:     #e1e4e8;
      --text:       #1f2a44;
      --text-mid:   #4a5568;
      --text-muted: #718096;
      --radius:     6px;
      --shadow:     0 2px 12px rgba(0,0,0,0.10);
      --shadow-lg:  0 8px 32px rgba(0,0,0,0.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "halyard-display", sans-serif;
      color: var(--text);
      background: var(--white);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    /* ─── Nav ─────────────────────────────────────────────────── */
    .nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: 64px;
      background: var(--dark);
      display: flex; align-items: center;
      padding: 0 40px;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    }
    .nav-logo img { height: 26px; width: auto; display: block; }
    .nav-right {
      margin-left: auto;
      display: flex; align-items: center; gap: 24px;
    }
    .nav-link {
      font-size: 0.78rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px;
      color: rgba(255,255,255,0.75);
      transition: color 0.15s;
    }
    .nav-link:hover { color: var(--green); }
    .nav-cta {
      background: var(--green);
      color: var(--dark);
      font-size: 0.78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
      padding: 8px 18px;
      border-radius: var(--radius);
      transition: background 0.15s;
    }
    .nav-cta:hover { background: var(--green-dark); color: var(--white); }

    /* ─── Hero ────────────────────────────────────────────────── */
    .hero {
      margin-top: 64px;
      background: var(--dark);
      padding: 72px 60px 64px;
      position: relative;
    }
    .hero-inner {
      max-width: 1400px; margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
      position: relative;
    }
    .hero-label {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--green);
      margin-bottom: 16px;
    }
    .hero h1 {
      font-size: clamp(2.2rem, 3.5vw, 3.4rem);
      font-weight: 800;
      color: var(--white);
      line-height: 1.12;
      letter-spacing: -0.8px;
      margin-bottom: 20px;
    }
    .hero h1 span { color: var(--green); }
    .hero-desc {
      font-size: 1rem;
      line-height: 1.75;
      color: rgba(255,255,255,0.6);
      margin-bottom: 36px;
    }
    .hero-stats {
      display: flex; gap: 40px;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 28px;
    }
    .hero-stat-n {
      font-size: 1.8rem; font-weight: 800;
      color: var(--green); line-height: 1;
      margin-bottom: 5px;
    }
    .hero-stat-l {
      font-size: 0.72rem; font-weight: 500;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* ─── Hero right panel ───────────────────────────────────── */
    .hero-right {
      display: flex; flex-direction: column; gap: 12px;
    }
    .hero-panel-label {
      font-size: 0.7rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px;
      color: rgba(255,255,255,0.35);
      margin-bottom: 4px;
    }
    .hero-track-cards {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .hero-track-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius);
      padding: 14px 16px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      display: flex; align-items: center; gap: 10px;
    }
    .hero-track-card:hover {
      background: rgba(132,189,0,0.1);
      border-color: rgba(132,189,0,0.3);
    }
    .htc-dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
    }
    .htc-name {
      font-size: 0.8rem; font-weight: 600;
      color: rgba(255,255,255,0.8);
      flex: 1;
    }
    .htc-count {
      font-size: 0.72rem; font-weight: 700;
      color: var(--green);
      background: rgba(132,189,0,0.12);
      padding: 2px 7px; border-radius: 10px;
    }

    /* ─── Browse view ─────────────────────────────────────────── */
    #view-browse { display: block; }
    #view-detail { display: none; margin-top: 64px; }

    /* ─── Filters ─────────────────────────────────────────────── */
    .filters-bar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 64px; z-index: 50;
    }
    .filters-inner {
      max-width: 1400px; margin: 0 auto;
      padding: 0 60px;
      display: flex; align-items: center;
      gap: 4px;
      overflow-x: auto;
    }
    .filter-btn {
      flex-shrink: 0;
      padding: 14px 18px;
      font-size: 0.8rem; font-weight: 600;
      color: var(--text-muted);
      background: none; border: none;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover { color: var(--text); }
    .filter-btn.active {
      color: var(--green-dark);
      border-bottom-color: var(--green);
    }

    /* ─── Roles list ──────────────────────────────────────────── */
    .roles-section {
      max-width: 1400px; margin: 0 auto;
      padding: 48px 60px 80px;
    }
    .roles-section-header {
      display: flex; align-items: baseline; gap: 12px;
      margin-bottom: 20px;
    }
    .roles-section-header h2 {
      font-size: 1rem; font-weight: 700; color: var(--text);
    }
    .roles-section-header .count {
      font-size: 0.8rem; color: var(--text-muted); font-weight: 500;
    }

    .roles-grid {
      display: flex; flex-direction: column; gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .role-card {
      background: var(--white);
      padding: 22px 28px;
      display: flex; align-items: center; gap: 20px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .role-card:hover { background: #f8faf2; }

    .role-card-level {
      width: 36px; height: 36px; flex-shrink: 0;
      border-radius: 50%;
      background: var(--light);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 800;
      color: var(--dark-mid);
      border: 1.5px solid var(--border);
    }
    .role-card-body { flex: 1; min-width: 0; }
    .role-card-title {
      font-size: 0.95rem; font-weight: 700;
      color: var(--text); margin-bottom: 4px;
    }
    .role-card-meta {
      font-size: 0.78rem; color: var(--text-muted);
      display: flex; align-items: center; gap: 10px;
    }
    .role-card-meta .dot {
      width: 3px; height: 3px; border-radius: 50%;
      background: var(--border);
    }
    .role-card-arrow {
      font-size: 1rem; color: var(--border);
      transition: color 0.15s, transform 0.15s;
    }
    .role-card:hover .role-card-arrow {
      color: var(--green); transform: translateX(3px);
    }

    /* group headers between tracks */
    .all-tracks-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px 32px;
    }
    .track-group { margin-bottom: 0; }
    .track-group-label {
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.7px;
      color: var(--text-muted);
      padding: 0 0 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .track-group-label::before {
      content: '';
      display: block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--track-colour, var(--border));
      flex-shrink: 0;
    }

    /* ─── Role detail view ────────────────────────────────────── */
    .detail-nav {
      background: var(--light);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      position: sticky; top: 64px; z-index: 50;
    }
    .detail-nav-inner {
      max-width: 860px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px;
      height: 52px;
    }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.82rem; font-weight: 600;
      color: var(--text-mid);
      background: none; border: none;
      padding: 6px 0;
      transition: color 0.15s;
    }
    .back-btn:hover { color: var(--green-dark); }
    .back-btn svg { flex-shrink: 0; }
    .detail-breadcrumb {
      font-size: 0.78rem; color: var(--text-muted);
      display: flex; align-items: center; gap: 6px;
    }
    .detail-breadcrumb .sep { color: var(--border); }

    .detail-body {
      max-width: 860px; margin: 0 auto;
      padding: 56px 40px 100px;
    }

    .detail-eyebrow {
      font-size: 0.78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.7px;
      color: var(--green-dark);
      margin-bottom: 12px;
    }
    .detail-title {
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      font-weight: 800; line-height: 1.2;
      letter-spacing: -0.5px;
      color: var(--dark);
      margin-bottom: 20px;
    }
    .detail-tags {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 32px;
    }
    .detail-tag {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.2px;
    }
    .detail-tag.level { background: var(--dark); color: var(--white); }
    .detail-tag.track { background: var(--green); color: var(--dark); }
    .detail-tag.type  { background: var(--light); color: var(--text-muted); border: 1px solid var(--border); }

    .detail-lead {
      font-size: 1.05rem; line-height: 1.8;
      color: var(--text-mid);
      border-left: 3px solid var(--green);
      padding-left: 20px;
      margin-bottom: 48px;
    }

    .detail-section { margin-bottom: 44px; }
    .detail-section-title {
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .resp-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .resp-list li {
      display: flex; gap: 12px; align-items: flex-start;
      font-size: 0.92rem; line-height: 1.7; color: var(--text-mid);
    }
    .resp-list li::before {
      content: '';
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
      flex-shrink: 0; margin-top: 8px;
    }

    /* ─── Requirements two-col ───── */
    .req-cols {
      display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
    }
    .req-col-title {
      font-size: 0.82rem; font-weight: 700;
      color: var(--text); margin-bottom: 14px;
    }
    .req-list { list-style: none; display: flex; flex-direction: column; gap: 9px; }
    .req-list li {
      font-size: 0.88rem; line-height: 1.6; color: var(--text-mid);
      display: flex; gap: 10px; align-items: flex-start;
    }
    .req-list li .chk {
      font-size: 0.7rem; font-weight: 800;
      color: var(--green); flex-shrink: 0; margin-top: 3px;
    }
    .req-list.desirable li .chk { color: var(--border); }

    /* ─── Career pathway ─────────────────────────────────────── */
    .pathway { display: flex; flex-direction: column; }
    .pathway-item {
      display: flex; align-items: stretch; gap: 0;
    }
    .pathway-left {
      display: flex; flex-direction: column; align-items: center;
      width: 48px; flex-shrink: 0;
    }
    .pathway-node-dot {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 800;
      flex-shrink: 0; z-index: 1;
    }
    .pathway-item.current .pathway-node-dot {
      background: var(--green); color: var(--dark);
      box-shadow: 0 0 0 4px rgba(132,189,0,0.15);
    }
    .pathway-item.other .pathway-node-dot {
      background: var(--light); color: var(--text-muted);
      border: 2px solid var(--border);
    }
    .pathway-line {
      width: 2px; background: var(--border);
      flex: 1; min-height: 16px;
    }
    .pathway-content {
      flex: 1; padding: 4px 0 24px 16px;
    }
    .pathway-item:last-child .pathway-content { padding-bottom: 0; }
    .pathway-role-title {
      font-size: 0.92rem; font-weight: 700; color: var(--text);
      margin-bottom: 3px;
      display: flex; align-items: center; gap: 8px;
    }
    .you-are-here {
      font-size: 0.68rem; font-weight: 700;
      background: var(--green); color: var(--dark);
      padding: 2px 8px; border-radius: 10px;
    }
    .pathway-role-desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }

    /* ─── Apply CTA ───────────────────────────────────────────── */
    .apply-block {
      margin-top: 56px;
      background: var(--dark);
      border-radius: var(--radius);
      padding: 36px 40px;
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
    }
    .apply-block-text h3 {
      font-size: 1.15rem; font-weight: 800;
      color: var(--white); margin-bottom: 6px;
    }
    .apply-block-text p { font-size: 0.85rem; color: rgba(255,255,255,0.55); }
    .apply-cta-btn {
      background: var(--green); color: var(--dark);
      font-size: 0.9rem; font-weight: 700;
      padding: 14px 32px; border-radius: var(--radius); border: none;
      white-space: nowrap; flex-shrink: 0;
      text-decoration: none; display: inline-block;
      transition: background 0.15s, transform 0.15s;
    }
    .apply-cta-btn:hover { background: var(--green-dark); color: var(--white); transform: translateY(-1px); }

    /* ─── Empty state ─────────────────────────────────────────── */
    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state p { font-size: 0.9rem; margin-top: 8px; }

    @media (max-width: 960px) {
      .hero-inner { grid-template-columns: 1fr; gap: 40px; }
      .hero-right { display: none; }
      .all-tracks-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .hero { padding: 48px 20px 40px; }
      .hero-stats { gap: 24px; flex-wrap: wrap; }
      .filters-inner, .roles-section, .detail-body { padding-left: 20px; padding-right: 20px; }
      .detail-nav { padding-left: 20px; padding-right: 20px; }
      .req-cols { grid-template-columns: 1fr; }
      .apply-block { flex-direction: column; align-items: flex-start; }
      .nav { padding: 0 20px; }
    }
  </style>
</head>

<!-- ─── Nav ──────────────────────────────────────────────────────────── -->
<nav class="nav">
  <a href="https://www.envitia.com" class="nav-logo">

</div><!-- /view-browse -->

<div id="view-detail">
  <div class="detail-nav">

      <button class="back-btn" onclick="goBack()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">

  <div class="detail-body" id="detailBody"></div>

// ─── State ───────────────────────────────────────────────────────────────────
let activeTrack = 'all';
let activeRoleId = null;

// ─── Hero track cards ─────────────────────────────────────────────────────────
function renderHeroCards() {
  const container = document.getElementById('heroTrackCards');
  const tracks = TRACKS.filter(t => t.id !== 'all');
  container.innerHTML = tracks.map(t => {
    const count = ROLES.filter(r => r.track === t.id).length;
    if (count === 0) return '';
    return `
      <div class="hero-track-card" onclick="setTrack('${t.id}'); document.querySelector('.filters-bar').scrollIntoView({behavior:'smooth'})">
        <span class="htc-dot" style="background:${t.colour}"></span>
        <span class="htc-name">${t.label}</span>
        <span class="htc-count">${count}</span>
      </div>
    `;
  }).join('');
}

// ─── Filter bar ──────────────────────────────────────────────────────────────
function renderFilters() {
  const bar = document.getElementById('filterBar');
  bar.innerHTML = TRACKS.map(t => `
    <button class="filter-btn ${t.id === activeTrack ? 'active' : ''}"
            onclick="setTrack('${t.id}')">
      ${t.label}
    </button>
  `).join('');
}

function setTrack(id) {
  activeTrack = id;
  renderFilters();
  renderRoles();
}

// ─── Roles list ──────────────────────────────────────────────────────────────
function renderRoles() {
  const section = document.getElementById('rolesSection');
  const filtered = activeTrack === 'all'
    ? ROLES
    : ROLES.filter(r => r.track === activeTrack);

  if (filtered.length === 0) {
    section.innerHTML = '<div class="empty-state"><p>No roles in this track yet - check back soon.</p></div>';
    return;
  }

  // Group by track
  const groups = {};
  filtered.forEach(r => {
    if (!groups[r.track]) groups[r.track] = [];
    groups[r.track].push(r);
  });

  const groupsHTML = Object.entries(groups).map(([trackId, roles]) => {
    const track = TRACKS.find(t => t.id === trackId);
    const sorted = [...roles].sort((a, b) => a.level.localeCompare(b.level));
    return `
      <div class="track-group">
        <div class="track-group-label" style="--track-colour:${track.colour || '#ccc'}">
          ${track.label}
        </div>
        <div class="roles-grid">
          ${sorted.map(role => `
            <div class="role-card" onclick="openRole('${role.id}')">
              <div class="role-card-level">${role.level}</div>
              <div class="role-card-body">
                <div class="role-card-title">${role.title}</div>
                <div class="role-card-meta">
                  <span>${track.label}</span>
                  <span class="dot"></span>
                  <span>Level ${role.level} - ${LEVELS[role.level]}</span>
                </div>
              </div>
              <div class="role-card-arrow">→</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');

  const useGrid = activeTrack === 'all' && Object.keys(groups).length > 1;
  section.innerHTML = useGrid
    ? `<div class="all-tracks-grid">${groupsHTML}</div>`
    : groupsHTML;
}

// ─── Role detail ─────────────────────────────────────────────────────────────
function openRole(id) {
  activeRoleId = id;
  const role = ROLES.find(r => r.id === id);
  const track = TRACKS.find(t => t.id === role.track);

  document.getElementById('view-browse').style.display = 'none';
  document.getElementById('view-detail').style.display = 'block';
  document.getElementById('detail-breadcrumb-text').textContent = role.title;

  const currentIdx = role.pathway.findIndex(n => n.current);

  document.getElementById('detailBody').innerHTML = `
    <div class="detail-eyebrow">${track.label}</div>
    <h1 class="detail-title">${role.title}</h1>
    <div class="detail-tags">
      <span class="detail-tag level">Level ${role.level}</span>
      <span class="detail-tag track">${track.label}</span>
      <span class="detail-tag type">${role.type}</span>
    </div>

    <p class="detail-lead">${role.purpose}</p>

    <div class="detail-section">
      <div class="detail-section-title">What you'll do</div>
      <ul class="resp-list">
        ${role.responsibilities.map(r => `<li>${r}</li>`).join('')}
      </ul>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">What we're looking for</div>
      <div class="req-cols">
        <div>
          <div class="req-col-title">Essential</div>
          <ul class="req-list">
            ${role.requirements.essential.map(r => `
              <li><span class="chk">✓</span>${r}</li>
            `).join('')}
          </ul>
        </div>
        <div>
          <div class="req-col-title">Nice to have</div>
          <ul class="req-list desirable">
            ${role.requirements.desirable.map(r => `
              <li><span class="chk">+</span>${r}</li>
            `).join('')}
          </ul>
        </div>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Where this role leads</div>
      <div class="pathway">
        ${role.pathway.map((node, i) => {
          const isLast = i === role.pathway.length - 1;
          return `
            <div class="pathway-item ${node.current ? 'current' : 'other'}">
              <div class="pathway-left">
                <div class="pathway-node-dot">${node.level}</div>
                ${!isLast ? '<div class="pathway-line"></div>' : ''}
              </div>
              <div class="pathway-content">
                <div class="pathway-role-title">
                  ${node.title}
                  ${node.current ? '<span class="you-are-here">This role</span>' : ''}
                </div>
                <div class="pathway-role-desc">${node.desc}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>

    <div class="apply-block">
      <div class="apply-block-text">
        <h3>Interested in this role?</h3>
        <p>Send us your CV and a short note on why Envitia interests you.</p>
      </div>
      <a href="mailto:careers@envitia.com?subject=Application - ${encodeURIComponent(role.title)}"
         class="apply-cta-btn">Apply for this role</a>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'instant' });
}

function goBack() {
  document.getElementById('view-browse').style.display = 'block';
  document.getElementById('view-detail').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'instant' });
}

// ─── Init ─────────────────────────────────────────────────────────────────────
renderHeroCards();
renderFilters();
renderRoles();
</script>
